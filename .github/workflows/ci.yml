name: CI

# Also called by release.yml (workflow_call), which releases only when it
# passes.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    name: Tests
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # The lowest and the latest PHP the plugin supports.
        php-version: ['7.4', '8.5']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xdebug
          tools: composer

      - name: Display PHP version
        run: php -v

      - name: Install Dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Run PHP Coding Standards Fixer
        run: vendor/bin/php-cs-fixer fix -v --dry-run --diff --config=php-cs-fixer.php

      - name: Run WordPress security rules and required docblocks
        run: make check-docs && vendor/bin/phpcs --standard=phpcs.xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Run ESLint
        run: npm ci --no-audit --no-fund && npm run lint

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=1G

      - name: Run PHPUnit
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --configuration=phpunit.xml

      # The plugin header, readme.txt and CHANGELOG.md must agree on the version.
      - name: Check version
        run: make check-version

      - name: Upload PHPUnit result report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-testdox-php_${{ matrix.php-version }}.txt
          path: var/tests-testdox.txt

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: tests-coverage-php_${{ matrix.php-version }}.txt
          path: var/tests-coverage.txt
